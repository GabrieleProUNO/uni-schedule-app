<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orario UniTrento - Medicina (SFM)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased">
    
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                <h1 class="text-xl font-bold">Orario SFM - UniTrento</h1>
            </div>
            <div>
                <button id="refresh-btn" class="bg-blue-800 hover:bg-blue-700 p-2 rounded-full transition" title="Aggiorna">
                    <i class="fa-solid fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-6">
        
        <!-- Controls -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6 gap-4">
            <button id="prev-week" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition font-medium w-full sm:w-auto">
                <i class="fa-solid fa-chevron-left mr-2"></i> Settimana Precedente
            </button>
            
            <div class="text-center font-semibold text-lg" id="current-week-label">
                Caricamento...
            </div>
            
            <button id="next-week" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition font-medium w-full sm:w-auto">
                Prossima Settimana <i class="fa-solid fa-chevron-right ml-2"></i>
            </button>
        </div>

        <!-- Loader -->
        <div id="loader-container" class="flex justify-center items-center py-20 hidden">
            <div class="loader"></div>
        </div>
        
        <!-- Error -->
        <div id="error-container" class="hidden bg-red-100 text-red-700 p-4 rounded-lg mb-6">
            <p><i class="fa-solid fa-triangle-exclamation mr-2"></i> Si è verificato un errore nel caricamento dell'orario.</p>
        </div>

        <!-- Schedule Container -->
        <div id="schedule-container" class="space-y-6">
            <!-- Days will be injected here by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-container" class="hidden flex flex-col justify-center items-center py-20 text-gray-500">
            <i class="fa-regular fa-calendar-xmark text-6xl mb-4 text-gray-300"></i>
            <p class="text-lg">Nessuna lezione prevista per questa settimana.</p>
        </div>

    </main>

    <footer class="text-center text-gray-400 text-sm py-8">
        &copy; 2026 - UniTrento Schedule Viewer
    </footer>

    <script src="app.js"></script>
</body>
</html>
